name: R package checks

on:
  push:
    branches: [main, cosinor-reframe]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: '4.4'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          dependencies: '"hard"'
          needs: check
      - name: Check vignette inline syntax
        shell: Rscript {0}
        run: |
          source("tests/testthat/helper-vignette-syntax.R")
          files <- list.files("vignettes", pattern = "[.]Rmd$", full.names = TRUE)
          stopifnot(length(files) > 0L)
          errors <- inline_r_parse_errors(files)
          if (length(errors)) stop(paste(errors, collapse = "\n"))
      - name: Check tracked builder syntax
        shell: Rscript {0}
        run: |
          files <- list.files("examples/pilots", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
          stopifnot(length(files) > 0L)
          invisible(lapply(files, parse))
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
          build_args: 'c("--no-build-vignettes", "--no-manual")'
          error-on: '"warning"'
          check-dir: '"check"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
